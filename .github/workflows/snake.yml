name: Contribution snake

on:
  schedule:
    - cron: "17 2 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff7a4d&color_dots=#ebedf0,#ffd9c7,#ffb08f,#ff8a5c,#e85d2c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff7a4d&color_dots=#161b22,#3b2620,#6b3624,#b34f2c,#ff7a4d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
