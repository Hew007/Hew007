<rect width="600" height="340" rx="20" fill="url(#bg)"/><rect width="600" height="340" rx="20" fill="url(#gl)"/>
<rect x=".5" y=".5" width="599" height="339" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
