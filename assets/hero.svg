<rect x="128" y="340" width="123" height="30" rx="15" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="189.5" y="360" text-anchor="middle" fill="#c9ced6">Agent Skills</text>
<rect x="261" y="340" width="123" height="30" rx="15" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="322.5" y="360" text-anchor="middle" fill="#c9ced6">Agent Memory</text>
<rect x="394" y="340" width="123" height="30" rx="15" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".14"/><text x="455.5" y="360" text-anchor="middle" fill="#c9ced6">On-device AI</text>
<rect x="527" y="340" width="170" height="30" rx="15" fill="#7ebba9" fill-opacity=".1" stroke="#7ebba9" stroke-opacity=".45"/><text x="612.0" y="360" text-anchor="middle" fill="#9fd3c3">React + TypeScript</text>
</g>

