<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hew — AI Builder and Frontend Engineer">
<style>
.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.ln{opacity:0;animation:show 12s infinite}
.l1{animation-delay:.4s}.l2{animation-delay:1.2s}.l3{animation-delay:2s}.l4{animation-delay:3s}.l5{animation-delay:3.8s}.l6{animation-delay:4.8s}
@keyframes show{0%{opacity:0}3%{opacity:1}78%{opacity:1}82%{opacity:0}100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ln{opacity:1;animation:none}.cur,.pulse{animation:none}}
</style>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1116"/><stop offset="1" stop-color="#191c23"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.1" r="0.7"><stop stop-color="#ff7a4d" stop-opacity=".16"/><stop offset="1" stop-color="#ff7a4d" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".06"/></pattern>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#dots)"/>
<rect width="1200" height="420" rx="24" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="419" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>

