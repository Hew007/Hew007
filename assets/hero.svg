<circle cx="22" cy="20" r="5.5" fill="#ff7a4d"/><circle cx="40" cy="20" r="5.5" fill="#f2ba72"/><circle cx="58" cy="20" r="5.5" fill="#7ebba9"/>
<text x="205" y="25" text-anchor="middle" class="mono" font-size="12" fill="#5d6570">~/lab — agent session</text>
