<text x="22" y="78" class="ln l1" fill="#9aa3ae"><tspan fill="#7ebba9">$</tspan> claude  <tspan fill="#5d6570"># + chrome-debug-mcp</tspan></text>
<text x="22" y="112" class="ln l2" fill="#f4f0e8"><tspan fill="#ff7a4d">›</tspan> attach_by_url <tspan fill="#f2ba72">"localhost:5173"</tspan></text>
