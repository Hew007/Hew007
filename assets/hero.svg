<text x="66" y="268" class="sans" font-size="26" font-weight="600" fill="#f4f0e8">AI Builder <tspan fill="#5d6570">/</tspan> Frontend Engineer <tspan fill="#5d6570">/</tspan> Indie Maker</text>
<text x="66" y="306" class="sans" font-size="19" fill="#9aa3ae">I build tools that help AI agents — and people — get real work done.</text>

