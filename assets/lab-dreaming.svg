<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="agent-dreaming: layered agent memory with offline dreaming consolidation">
<style>.s{font-family:ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.flow{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flow,.grow,.tw{animation:none}}</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12161c"/><stop offset="1" stop-color="#1a1e26"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r=".8"><stop stop-color="#7ebba9" stop-opacity=".14"/><stop offset="1" stop-color="#7ebba9" stop-opacity="0"/></radialGradient></defs>
<rect width="600" height="340" rx="20" fill="url(#bg)"/><rect width="600" height="340" rx="20" fill="url(#gl)"/>
<rect x=".5" y=".5" width="599" height="339" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<text x="32" y="46" class="m" font-size="12" letter-spacing="2.5" fill="#7ebba9">AI LAB · 03 · AGENT MEMORY</text>
<text x="32" y="88" class="s" font-size="31" font-weight="800" letter-spacing="-.5" fill="#f4f0e8">agent-dreaming</text>
<text x="32" y="118" class="s" font-size="15.5" fill="#9aa3ae">Layered memory + offline “dreaming”, in ~700 lines.</text>
<rect x="32" y="146" width="330" height="30" rx="7" fill="#ff7a4d" fill-opacity=".14" stroke="#ff7a4d" stroke-opacity=".5"/><text x="46" y="166" class="m" font-size="12.5" fill="#f4f0e8">working <tspan fill="#9aa3ae">· this session</tspan></text><rect x="32" y="184" width="280" height="30" rx="7" fill="#f2ba72" fill-opacity=".14" stroke="#f2ba72" stroke-opacity=".5"/><text x="46" y="204" class="m" font-size="12.5" fill="#f4f0e8">episodic <tspan fill="#9aa3ae">· notes/*.md</tspan></text><rect x="32" y="222" width="230" height="30" rx="7" fill="#7ebba9" fill-opacity=".14" stroke="#7ebba9" stroke-opacity=".5"/><text x="46" y="242" class="m" font-size="12.5" fill="#f4f0e8">long-term <tspan fill="#9aa3ae">· consolidated</tspan></text>
<g transform="translate(470 196)"><circle r="44" fill="#f4f0e8" fill-opacity=".9"/><circle cx="18" cy="-12" r="40" fill="#161a21"/></g>
<g fill="#f4f0e8"><circle class="tw" cx="420" cy="150" r="2"/><circle class="tw" cx="548" cy="160" r="1.6" style="animation-delay:1s"/><circle class="tw" cx="530" cy="250" r="1.8" style="animation-delay:2s"/></g>
<path class="flow" d="M410 236Q380 266 280 252" fill="none" stroke="#9fd3c3" stroke-width="1.6"/><text x="420" y="270" class="m" font-size="11.5" fill="#9fd3c3">dream()</text>
<g class="m" font-size="12"><rect x="32" y="292" width="98" height="24" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/><text x="81" y="308" text-anchor="middle" fill="#c9ced6">TypeScript</text><rect x="138" y="292" width="120.8" height="24" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/><text x="198.4" y="308" text-anchor="middle" fill="#c9ced6">Anthropic SDK</text><rect x="266.8" y="292" width="113.19999999999999" height="24" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/><text x="323.4" y="308" text-anchor="middle" fill="#c9ced6">no vector DB</text></g>
</svg>