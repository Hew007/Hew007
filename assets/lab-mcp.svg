<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="chrome-debug-mcp: an MCP server that lets AI agents debug Chrome pages">
<style>.s{font-family:ui-sans-serif,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.flow{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.pt{transform-box:fill-box;transform-origin:center;opacity:0;animation:pt 9s linear infinite}
@keyframes pt{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.9}85%{opacity:.7}100%{transform:translate(-70px,150px) rotate(320deg);opacity:0}}
.ch{opacity:0;animation:ch 14s ease-out infinite}@keyframes ch{0%{opacity:0;transform:translateY(4px)}5%{opacity:1;transform:none}82%{opacity:1}90%{opacity:0}100%{opacity:0}}
.cl{animation:cl 38s linear infinite}@keyframes cl{from{transform:translateX(-260px)}to{transform:translateX(640px)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 6s ease-in-out infinite}@keyframes halo{50%{transform:scale(1.15);opacity:.2}}
@media (prefers-reduced-motion:reduce){.flow,.grow,.tw,.cl,.halo{animation:none}.ch{animation:none;opacity:1}.pt{display:none}}</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12161c"/><stop offset="1" stop-color="#1a1e26"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r=".8"><stop stop-color="#ff7a4d" stop-opacity=".14"/><stop offset="1" stop-color="#ff7a4d" stop-opacity="0"/></radialGradient></defs>
<rect width="600" height="340" rx="20" fill="url(#bg)"/><rect width="600" height="340" rx="20" fill="url(#gl)"/>
<rect x=".5" y=".5" width="599" height="339" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<text x="32" y="46" class="m" font-size="12" letter-spacing="2.5" fill="#ff7a4d">AI LAB · 01 · MCP SERVER</text>
<text x="32" y="88" class="s" font-size="31" font-weight="800" letter-spacing="-.5" fill="#f4f0e8">chrome-debug-mcp</text>
<text x="32" y="118" class="s" font-size="15.5" fill="#9aa3ae">Give coding agents eyes on your live Chrome tab.</text>
<rect x="32" y="150" width="150" height="70" rx="10" fill="#0b0d11" stroke="#ff7a4d" stroke-opacity=".55"/><text x="107" y="180" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#f4f0e8">AI Agent</text><text x="107" y="200" text-anchor="middle" class="m" font-size="11" fill="#9aa3ae">Claude Code · Cursor</text><rect x="225" y="150" width="150" height="70" rx="10" fill="#0b0d11" stroke="#f2ba72" stroke-opacity=".55"/><text x="300" y="180" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#f4f0e8">MCP Server</text><text x="300" y="200" text-anchor="middle" class="m" font-size="11" fill="#9aa3ae">attach · eval · logs</text><rect x="418" y="150" width="150" height="70" rx="10" fill="#0b0d11" stroke="#7ebba9" stroke-opacity=".55"/><text x="493" y="180" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#f4f0e8">Chrome</text><text x="493" y="200" text-anchor="middle" class="m" font-size="11" fill="#9aa3ae">CDP :9222</text>
<g fill="none" stroke-width="2"><path class="flow" d="M184 178H223" stroke="#ff7a4d"/><path class="flow" d="M377 178H416" stroke="#f2ba72"/><path class="flow" d="M416 196H377" stroke="#7ebba9" style="animation-direction:reverse"/><path class="flow" d="M223 196H184" stroke="#7ebba9" style="animation-direction:reverse"/></g>
<text x="300" y="252" text-anchor="middle" class="m" font-size="12.5" fill="#9fd3c3">reload_and_check → “0 errors, fix verified”</text>
<g class="m" font-size="12"><rect x="32" y="292" width="98" height="24" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/><text x="81" y="308" text-anchor="middle" fill="#c9ced6">TypeScript</text><rect x="138" y="292" width="75.19999999999999" height="24" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/><text x="175.6" y="308" text-anchor="middle" fill="#c9ced6">MCP SDK</text><rect x="221.2" y="292" width="204.39999999999998" height="24" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".12"/><text x="323.4" y="308" text-anchor="middle" fill="#c9ced6">Chrome DevTools Protocol</text></g>
</svg>